version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - report_data:/app/data/reports
      - staging_data:/app/data/staging
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_URL=http://chromadb:8000
      - ENVIRONMENT=production
    depends_on:
      chromadb:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - report_data:/app/data/reports
      - staging_data:/app/data/staging
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_URL=http://chromadb:8000
      - ENVIRONMENT=production
    depends_on:
      chromadb:
        condition: service_healthy
    command: python worker.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  chroma_data:
  report_data:
  staging_data:
