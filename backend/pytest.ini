[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -m "not retrieval_eval"
markers =
    retrieval_eval: full 261-case retrieval eval (slow, run with -m retrieval_eval)
    integration: tests requiring LLM API access
