name: CodeQL

# Disabled from auto-triggering (2026-08-23): code scanning upload requires
# GitHub Advanced Security on a private repo, which isn't enabled here, so
# every run failed with "Code scanning is not enabled for this repository."
# Re-add push/pull_request/schedule triggers once Advanced Security (or a
# public repo) makes the upload step viable. workflow_dispatch keeps a
# manual "Run workflow" button available in the meantime.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
